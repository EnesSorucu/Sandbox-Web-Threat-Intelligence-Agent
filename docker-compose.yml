version: '3.8'

services:
  # Container 1: Web Interface & Rule-Based Scanners (Playwright, SSL, WHOIS)
  frontend-api:
    build: 
      context: ./frontend-api
      dockerfile: Dockerfile
    container_name: secsandbox_frontend
    ports:
      - "8000:8000"
    volumes:
      - ./frontend-api:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - sandbox_network

  # Container 2: Placeholder for the future AI/NLP Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: secsandbox_ai
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
    networks:
      - sandbox_network

networks:
  sandbox_network:
    driver: bridge
